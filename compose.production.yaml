x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env.production
  environment:
    DATABASE_URL: postgresql+psycopg://coursewatch:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/coursewatch
    ENVIRONMENT: production
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coursewatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: coursewatch
    volumes: ["postgres:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coursewatch"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://coursewatch:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/coursewatch
    command: ["python", "-m", "coursewatch.db"]
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *backend
  worker:
    <<: *backend
    command: ["python", "-m", "coursewatch.worker"]
    stop_grace_period: 60s
  web:
    build: ./web
    restart: unless-stopped
    depends_on: [api]
  proxy:
    image: caddy:2-alpine
    environment:
      APP_HOST: ${APP_HOST:?Set APP_HOST}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on: [web, api]
volumes:
  postgres:
  caddy_data:
  caddy_config:
