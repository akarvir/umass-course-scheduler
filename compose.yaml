services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coursewatch
      POSTGRES_PASSWORD: coursewatch
      POSTGRES_DB: coursewatch
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coursewatch"]
      interval: 5s
      timeout: 5s
      retries: 10
  mail:
    image: axllent/mailpit:v1.31.4
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  postgres:
